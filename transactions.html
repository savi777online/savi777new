<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DURGA - Transactions</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f2f5;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            color: #00aa55;
            animation: blockPulse 2s infinite;
        }
        @keyframes blockPulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
            50% { opacity: 1; text-shadow: 0 0 5px rgba(0,170,85,0.3); }
            100% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
        }

        .transaction-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
        }
        .transaction-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .transaction-type {
            font-weight: 700;
            color: #1a1a2e;
        }
        .transaction-amount {
            font-size: 18px;
            font-weight: 700;
        }
        .transaction-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
        }
        .status-approved {
            background: #d1fae5;
            color: #10b981;
        }
        .status-pending {
            background: #fff3e0;
            color: #ff9800;
        }
        .status-rejected {
            background: #fee2e2;
            color: #f44336;
        }
        .transaction-date {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
        }
        .no-data {
            text-align: center;
            color: #888;
            padding: 40px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
        }
        .bottom-item {
            text-align: center;
            cursor: pointer;
            padding: 6px 0;
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: #ff9800;
        }
        .bottom-item:active {
            transform: scale(0.95);
        }
        .bottom-home {
            background: #3b82f6;
            color: #ffffff !important;
            padding: 8px 0;
            border-radius: 40px;
            margin: 0 8px;
            flex: 1.2;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="title">TRANSACTIONS</div>
        <div style="width: 30px;"></div>
    </div>
    <div id="transactionsList">Loading...</div>
</div>

<div class="bottom-nav">
    <div class="bottom-item" onclick="location.href='history.html'">HISTORY</div>
    <div class="bottom-item" onclick="location.href='mybids.html'">PASSBOOK</div>
    <div class="bottom-item bottom-home" onclick="location.href='dashboard.html'">HOME</div>
    <div class="bottom-item" onclick="location.href='funds.html'">FUNDS</div>
    <div class="bottom-item" onclick="location.href='chat.html'">SUPPORT</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
        authDomain: "savi777-5b8af.firebaseapp.com",
        projectId: "savi777-5b8af",
        storageBucket: "savi777-5b8af.firebasestorage.app",
        messagingSenderId: "396388183217",
        appId: "1:396388183217:web:48d946a4198963cefa0690"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    async function loadTransactions() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        
        const transactions = await db.collection('transactions').where('userId', '==', user.uid).orderBy('date', 'desc').get();
        const withdrawals = await db.collection('withdrawRequests').where('userId', '==', user.uid).orderBy('date', 'desc').get();
        
        const container = document.getElementById('transactionsList');
        let html = '';
        
        for (const doc of withdrawals.docs) {
            const w = doc.data();
            const date = w.date?.toDate().toLocaleString() || 'Pending';
            const statusClass = w.status === 'Completed' ? 'status-approved' : (w.status === 'Rejected' ? 'status-rejected' : 'status-pending');
            html += `
                <div class="transaction-card">
                    <div class="transaction-header">
                        <span class="transaction-type">WITHDRAWAL</span>
                        <span class="transaction-amount">-₹${w.amount}</span>
                    </div>
                    <div><span class="transaction-status ${statusClass}">${w.status || 'PENDING'}</span></div>
                    <div class="transaction-date">${date}</div>
                </div>
            `;
        }
        
        for (const doc of transactions.docs) {
            const t = doc.data();
            if (t.type === 'credit') {
                const date = t.date?.toDate().toLocaleString() || 'Pending';
                const statusClass = t.status === 'Completed' ? 'status-approved' : (t.status === 'Rejected' ? 'status-rejected' : 'status-pending');
                html += `
                    <div class="transaction-card">
                        <div class="transaction-header">
                            <span class="transaction-type">DEPOSIT</span>
                            <span class="transaction-amount">+₹${t.amount}</span>
                        </div>
                        <div><span class="transaction-status ${statusClass}">${t.status || 'PENDING'}</span></div>
                        <div class="transaction-date">${date}</div>
                    </div>
                `;
            }
        }
        
        container.innerHTML = html || '<div class="no-data">No transactions found</div>';
    }
    
    function goBack() { window.location.href = 'dashboard.html'; }
    
    auth.onAuthStateChanged(user => { if (!user) window.location.href = 'index.html'; else loadTransactions(); });
</script>
</body>
</html>
