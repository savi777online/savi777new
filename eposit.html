<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DURGA - Deposit</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f2f5;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #ffffff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }
        .app-name {
            font-size: 22px;
            font-weight: 800;
            color: #00aa55;
            animation: blockPulse 2s infinite;
        }
        @keyframes blockPulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
            50% { opacity: 1; text-shadow: 0 0 5px rgba(0,170,85,0.3); }
            100% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
        }
        .balance {
            background: #ff9800;
            padding: 6px 16px;
            border-radius: 25px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* Deposit Card */
        .deposit-card {
            background: #ffffff;
            margin: 16px;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }
        .deposit-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        /* Amount Grid */
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .amount-btn {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .amount-btn.active {
            background: #ff9800;
            color: #ffffff;
            border-color: #ff9800;
        }
        .amount-btn:active {
            transform: scale(0.97);
        }

        /* Custom Amount */
        .custom-amount input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
        }
        .custom-amount input:focus {
            border-color: #ff9800;
        }

        /* UPI Info */
        .upi-info {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .upi-id {
            font-size: 18px;
            font-weight: 700;
            color: #ff9800;
            margin: 8px 0;
            word-break: break-all;
        }
        .copy-btn {
            background: #ff9800;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }
        .copy-btn:active {
            transform: scale(0.97);
        }

        /* QR Code Section */
        .qr-section {
            background: #ffffff;
            border: 2px dashed #ff9800;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .qr-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .qr-amount {
            font-size: 18px;
            font-weight: 700;
            color: #ff9800;
            margin-top: 8px;
        }

        /* UTR Section */
        .utr-section {
            margin-bottom: 16px;
            display: none;
        }
        .utr-section input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .utr-section input:focus {
            border-color: #ff9800;
        }

        /* Generate QR Button */
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: #ff9800;
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .generate-btn:active {
            transform: scale(0.98);
        }

        /* Verify Button */
        .verify-btn {
            width: 100%;
            padding: 16px;
            background: #10b981;
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .verify-btn:active {
            transform: scale(0.98);
        }

        .message {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }
        .success {
            background: #d1fae5;
            color: #10b981;
        }
        .error {
            background: #fee2e2;
            color: #f44336;
        }
        .hidden {
            display: none;
        }

        /* Timer */
        .timer-box {
            background: #fef3c7;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .timer-text {
            font-size: 20px;
            font-weight: 700;
            color: #d97706;
            font-family: monospace;
        }
        .timer-label {
            font-size: 11px;
            color: #92400e;
            margin-top: 4px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 16px;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
            gap: 8px;
        }
        .bottom-item {
            text-align: center;
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: #ff9800;
            border-radius: 30px;
            transition: all 0.2s;
        }
        .bottom-item:active {
            transform: scale(0.95);
        }
        .bottom-home {
            background: #3b82f6;
            color: #ffffff !important;
            padding: 10px 0;
            border-radius: 40px;
            margin: 0 4px;
            flex: 1.3;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <span class="app-name">DURGA</span>
        <div class="balance" onclick="showBalance()">₹<span id="userBalance">0</span></div>
    </div>

    <!-- Deposit Card -->
    <div class="deposit-card">
        <div class="deposit-title">ADD FUNDS</div>
        
        <div class="amount-grid">
            <div class="amount-btn" onclick="selectAmount(200)">₹200</div>
            <div class="amount-btn" onclick="selectAmount(500)">₹500</div>
            <div class="amount-btn" onclick="selectAmount(1000)">₹1000</div>
            <div class="amount-btn" onclick="selectAmount(2000)">₹2000</div>
            <div class="amount-btn" onclick="selectAmount(5000)">₹5000</div>
            <div class="amount-btn" onclick="selectAmount(10000)">₹10000</div>
        </div>
        
        <div class="custom-amount">
            <input type="number" id="customAmount" placeholder="Enter custom amount (Min ₹200)" inputmode="numeric" pattern="\d*">
        </div>
        
        <div class="upi-info">
            <div>📱 Send payment to this UPI ID</div>
            <div class="upi-id" id="upiIdDisplay">win777app@axl</div>
            <button class="copy-btn" onclick="copyUpiId()">COPY UPI ID</button>
        </div>
        
        <button class="generate-btn" id="generateBtn">GENERATE QR CODE</button>
        
        <!-- QR Code Section -->
        <div class="qr-section" id="qrSection">
            <div class="qr-title">📸 SCAN QR CODE TO PAY</div>
            <div id="qrcode"></div>
            <div class="qr-amount" id="qrAmountDisplay">Amount: ₹0</div>
        </div>
        
        <!-- UTR Section -->
        <div class="utr-section" id="utrSection">
            <input type="text" id="utrNumber" placeholder="Enter UTR / Transaction ID" maxlength="30">
            <button class="verify-btn" id="verifyBtn">✅ SUBMIT DEPOSIT REQUEST</button>
        </div>
        
        <!-- Timer -->
        <div class="timer-box" id="timerBox">
            <div class="timer-text" id="timerText">05:00</div>
            <div class="timer-label">⏳ Awaiting verification...</div>
        </div>
        
        <div id="message" class="message hidden"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="bottom-item" onclick="location.href='history.html'">HISTORY</div>
        <div class="bottom-item" onclick="location.href='mybids.html'">PASSBOOK</div>
        <div class="bottom-item bottom-home" onclick="location.href='dashboard.html'">HOME</div>
        <div class="bottom-item" onclick="location.href='funds.html'">FUNDS</div>
        <div class="bottom-item" onclick="location.href='chat.html'">SUPPORT</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
        authDomain: "savi777-5b8af.firebaseapp.com",
        projectId: "savi777-5b8af",
        storageBucket: "savi777-5b8af.firebasestorage.app",
        messagingSenderId: "396388183217",
        appId: "1:396388183217:web:48d946a4198963cefa0690"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Check login
    if (sessionStorage.getItem('loggedIn') !== 'true') {
        window.location.href = 'index.html';
    }
    
    const currentUserId = sessionStorage.getItem('userId');
    
    let selectedAmount = 200;
    let currentTransactionId = null;
    let timerInterval = null;
    let pendingAmount = 0;
    
    // UPI ID
    const upiId = "win777app@axl";
    const upiName = "WIN777 Services";
    
    document.getElementById('upiIdDisplay').innerHTML = upiId;
    
    async function loadUserData() {
        try {
            const doc = await db.collection('users').doc(currentUserId).get();
            if (doc.exists) {
                document.getElementById('userBalance').innerText = doc.data().balance || 0;
            }
        } catch (error) {}
    }
    
    function selectAmount(amount) {
        selectedAmount = amount;
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('customAmount').value = '';
        // Hide QR and UTR sections when amount changes
        document.getElementById('qrSection').style.display = 'none';
        document.getElementById('utrSection').style.display = 'none';
        document.getElementById('generateBtn').style.display = 'block';
    }
    
    function getAmount() {
        const custom = parseInt(document.getElementById('customAmount').value);
        if (custom && custom >= 200) return custom;
        return selectedAmount;
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerText = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.classList.remove('hidden');
        setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }
    
    function copyUpiId() {
        navigator.clipboard.writeText(upiId);
        showMessage('UPI ID copied!', 'success');
    }
    
    function generateQR() {
        const amount = getAmount();
        
        if (amount < 200) {
            showMessage('Minimum deposit is ₹200', 'error');
            return;
        }
        if (amount > 50000) {
            showMessage('Maximum deposit is ₹50,000', 'error');
            return;
        }
        
        pendingAmount = amount;
        
        // Create UPI payment URL
        const upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(upiName)}&am=${amount}&cu=INR&tn=DURGA%20Deposit`;
        
        // Clear previous QR code
        document.getElementById('qrcode').innerHTML = '';
        
        // Generate new QR code
        new QRCode(document.getElementById("qrcode"), {
            text: upiString,
            width: 200,
            height: 200,
            colorDark: "#1a1a2e",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        document.getElementById('qrAmountDisplay').innerHTML = `Amount: ₹${amount}`;
        document.getElementById('qrSection').style.display = 'block';
        document.getElementById('utrSection').style.display = 'block';
        document.getElementById('generateBtn').style.display = 'none';
        
        showMessage(`✅ QR Code generated for ₹${amount}. Pay to ${upiId}`, 'success');
    }
    
    async function submitDeposit() {
        const amount = pendingAmount || getAmount();
        const utr = document.getElementById('utrNumber').value.trim();
        
        if (amount < 200) {
            showMessage('Minimum deposit is ₹200', 'error');
            return;
        }
        if (!utr) {
            showMessage('Please enter UTR / Transaction ID', 'error');
            return;
        }
        
        if (!confirm(`✅ Confirm payment of ₹${amount}?\n\nUPI ID: ${upiId}\nUTR: ${utr}`)) {
            return;
        }
        
        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.innerText = 'SUBMITTING...';
        
        try {
            // Create transaction record
            const transactionRef = await db.collection('transactions').add({
                userId: currentUserId,
                type: 'credit',
                amount: amount,
                userUTR: utr,
                upiId: upiId,
                status: 'Pending',
                date: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            currentTransactionId = transactionRef.id;
            
            showMessage(`✅ Deposit request submitted! Amount: ₹${amount}\nUTR: ${utr}\n\nYour balance will be updated after verification.`, 'success');
            
            // Clear UTR input
            document.getElementById('utrNumber').value = '';
            
            // Start timer
            startTimer();
            
            // Listen for transaction approval
            listenForTransactionApproval();
            
        } catch (error) {
            showMessage('Error: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = '✅ SUBMIT DEPOSIT REQUEST';
        }
    }
    
    function startTimer() {
        const timerBox = document.getElementById('timerBox');
        timerBox.style.display = 'block';
        
        let timeLeft = 300; // 5 minutes
        const timerText = document.getElementById('timerText');
        
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerBox.style.display = 'none';
                showMessage('Verification time expired! Please contact support.', 'error');
            }
        }, 1000);
    }
    
    function listenForTransactionApproval() {
        if (!currentTransactionId) return;
        
        const unsubscribe = db.collection('transactions').doc(currentTransactionId)
            .onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.status === 'Completed') {
                        // Transaction approved
                        if (timerInterval) clearInterval(timerInterval);
                        document.getElementById('timerBox').style.display = 'none';
                        showMessage(`✅ ₹${data.amount} added to your balance!`, 'success');
                        loadUserData(); // Refresh balance
                        unsubscribe();
                        
                        // Reset form after 2 seconds
                        setTimeout(() => {
                            document.getElementById('qrSection').style.display = 'none';
                            document.getElementById('utrSection').style.display = 'none';
                            document.getElementById('generateBtn').style.display = 'block';
                            document.getElementById('utrNumber').value = '';
                            document.getElementById('customAmount').value = '';
                            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
                            selectedAmount = 200;
                        }, 2000);
                    } else if (data.status === 'Rejected') {
                        showMessage(`❌ Deposit request rejected. Contact support.`, 'error');
                        unsubscribe();
                    }
                }
            });
    }
    
    function showBalance() {
        db.collection('users').doc(currentUserId).get().then(doc => {
            alert(`💰 Balance: ₹${doc.data()?.balance || 0}`);
        });
    }
    
    function goBack() {
        window.location.href = 'dashboard.html';
    }
    
    // Event Listeners
    document.getElementById('generateBtn').onclick = generateQR;
    document.getElementById('verifyBtn').onclick = submitDeposit;
    document.getElementById('customAmount').addEventListener('input', function() {
        if (this.value) {
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('qrSection').style.display = 'none';
            document.getElementById('utrSection').style.display = 'none';
            document.getElementById('generateBtn').style.display = 'block';
        }
    });
    
    // Load user data
    loadUserData();
    
    window.selectAmount = selectAmount;
    window.copyUpiId = copyUpiId;
    window.showBalance = showBalance;
    window.goBack = goBack;
</script>
</body>
</html>
