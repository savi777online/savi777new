<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SAVI777 - My Bids</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; background: #f0f2f5; min-height: 100vh; }
        
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e0e0e0; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
        .title { font-size: 18px; font-weight: bold; flex: 1; text-align: center; color: #1a1a2e; }
        
        .tab-bar { display: flex; background: #fff; margin: 16px; border-radius: 12px; padding: 4px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; color: #888; }
        .tab.active { background: #007bff; color: #fff; }
        
        .bid-card { background: #fff; margin: 12px; border-radius: 16px; padding: 16px; border: 1px solid #e0e0e0; }
        .bid-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .market-name { font-weight: bold; color: #1a1a2e; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .status-won { background: #d4edda; color: #155724; }
        .status-lost { background: #f8d7da; color: #721c24; }
        .status-pending { background: #fff3cd; color: #856404; }
        .bid-detail { margin: 8px 0; color: #666; font-size: 14px; }
        .bid-date { font-size: 11px; color: #888; margin-top: 8px; }
        
        .no-data { text-align: center; color: #888; padding: 40px; }
        .hidden { display: none; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #fff; display: flex; justify-content: space-around; padding: 8px 12px; border-top: 1px solid #e0e0e0; }
        .nav-item { text-align: center; color: #888; cursor: pointer; font-size: 10px; flex: 1; padding: 6px 0; }
        .nav-item.active { color: #007bff; }
        
        .clear-btn { background: #dc3545; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; margin: 8px 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
        <div class="title">My Bids</div>
        <div style="width:30px;"></div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active" onclick="showTab('bids')">Bids</div>
        <div class="tab" onclick="showTab('transactions')">Transactions</div>
        <div class="tab" onclick="showTab('rates')">Rates</div>
    </div>
    
    <div id="bidsTab">
        <button class="clear-btn" onclick="clearAllBids()">Clear All Bids</button>
        <div id="bidsList">Loading...</div>
    </div>
    
    <div id="transactionsTab" class="hidden">
        <button class="clear-btn" onclick="clearAllTransactions()">Clear All Transactions</button>
        <div id="transactionsList">Loading...</div>
    </div>
    
    <div id="ratesTab" class="hidden">
        <div class="bid-card">
            <div class="bid-header"><span class="market-name">Game Rates</span></div>
            <div class="bid-detail">Single Digit: 10x</div>
            <div class="bid-detail">Jodi: 100x</div>
            <div class="bid-detail">Single Pana: 160x</div>
            <div class="bid-detail">Double Pana: 320x</div>
            <div class="bid-detail">Triple Pana: 1000x</div>
            <div class="bid-detail">Half Sangam A: 1000x</div>
            <div class="bid-detail">Half Sangam B: 1000x</div>
            <div class="bid-detail">Full Sangam: 10000x</div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='dashboard.html'">Home</div>
        <div class="nav-item" onclick="location.href='deposit.html'">Deposit</div>
        <div class="nav-item" onclick="location.href='withdraw.html'">Withdraw</div>
        <div class="nav-item active" onclick="location.href='mybids.html'">Bids</div>
        <div class="nav-item" onclick="location.href='chat.html'">Support</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
        authDomain: "savi777-5b8af.firebaseapp.com",
        projectId: "savi777-5b8af",
        storageBucket: "savi777-5b8af.firebasestorage.app",
        messagingSenderId: "396388183217",
        appId: "1:396388183217:web:48d946a4198963cefa0690",
        measurementId: "G-42PDZRC747"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const gameRates = { 'Single Digit': 10, 'Jodi': 100, 'Single Pana': 160, 'Double Pana': 320, 'Triple Pana': 1000, 'Half Sangam A': 1000, 'Half Sangam B': 1000, 'Full Sangam': 10000 };
    
    function showTab(tab) {
        document.getElementById('bidsTab').classList.add('hidden');
        document.getElementById('transactionsTab').classList.add('hidden');
        document.getElementById('ratesTab').classList.add('hidden');
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        if (tab === 'bids') loadBids();
        if (tab === 'transactions') loadTransactions();
    }
    
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'index.html';
        else { loadBids(); }
    });
    
    async function loadBids() {
        const user = auth.currentUser;
        const snapshot = await db.collection('bids').where('userId', '==', user.uid).orderBy('createdAt', 'desc').get();
        const container = document.getElementById('bidsList');
        if (snapshot.empty) { container.innerHTML = '<div class="no-data">No bids placed yet</div>'; return; }
        let html = '';
        snapshot.forEach(doc => {
            const b = doc.data();
            const statusClass = b.status === 'won' ? 'status-won' : (b.status === 'lost' ? 'status-lost' : 'status-pending');
            const statusText = b.status ? b.status.toUpperCase() : 'PENDING';
            const date = b.createdAt?.toDate().toLocaleString() || 'Pending';
            html += `
                <div class="bid-card">
                    <div class="bid-header">
                        <span class="market-name">${b.market || 'Market'}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="bid-detail"><strong>${b.gameType}</strong> | ${b.value}</div>
                    <div class="bid-detail">Amount: ₹${b.points} | Rate: ${gameRates[b.gameType] || 10}x</div>
                    <div class="bid-date">${date}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    async function loadTransactions() {
        const user = auth.currentUser;
        const snapshot = await db.collection('transactions').where('userId', '==', user.uid).orderBy('date', 'desc').get();
        const container = document.getElementById('transactionsList');
        if (snapshot.empty) { container.innerHTML = '<div class="no-data">No transactions yet</div>'; return; }
        let html = '';
        snapshot.forEach(doc => {
            const t = doc.data();
            const date = t.date?.toDate().toLocaleString() || 'Pending';
            const isCredit = t.type === 'credit';
            html += `
                <div class="bid-card">
                    <div class="bid-header">
                        <span class="market-name">${isCredit ? 'Deposit' : 'Withdrawal'}</span>
                        <span class="status ${t.status === 'Completed' ? 'status-won' : 'status-pending'}">${t.status || 'PENDING'}</span>
                    </div>
                    <div class="bid-detail" style="font-size:18px; font-weight:bold;">${isCredit ? '+' : '-'} ₹${t.amount}</div>
                    <div class="bid-date">${date}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    async function clearAllBids() {
        if (!confirm('Delete all your bid history? This cannot be undone!')) return;
        const user = auth.currentUser;
        const snapshot = await db.collection('bids').where('userId', '==', user.uid).get();
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        alert('All bids cleared!');
        loadBids();
    }
    
    async function clearAllTransactions() {
        if (!confirm('Delete all transaction history? This cannot be undone!')) return;
        const user = auth.currentUser;
        const snapshot = await db.collection('transactions').where('userId', '==', user.uid).get();
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        alert('All transactions cleared!');
        loadTransactions();
    }
    
    window.showTab = showTab;
    window.clearAllBids = clearAllBids;
    window.clearAllTransactions = clearAllTransactions;
</script>
</body>
</html>
