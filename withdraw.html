<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DURGA - Withdraw</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f2f5;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .header {
            background: #ffffff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .app-name {
            font-size: 22px;
            font-weight: 800;
            color: #00aa55;
            animation: blockPulse 2s infinite;
        }
        @keyframes blockPulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
            50% { opacity: 1; text-shadow: 0 0 5px rgba(0,170,85,0.3); }
            100% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
        }
        .balance {
            background: #ff9800;
            padding: 6px 16px;
            border-radius: 25px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .withdraw-card {
            background: #ffffff;
            margin: 16px;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }
        .withdraw-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .amount-btn {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .amount-btn.active {
            background: #ff9800;
            color: #ffffff;
            border-color: #ff9800;
        }
        .amount-btn:active {
            transform: scale(0.97);
        }

        .custom-amount input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .bank-info {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .bank-detail {
            padding: 6px 0;
            color: #333;
            font-size: 13px;
        }
        .no-bank {
            color: #f44336;
            text-align: center;
            padding: 12px;
        }

        .withdraw-btn {
            width: 100%;
            padding: 16px;
            background: #f59e0b;
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .withdraw-btn:active {
            transform: scale(0.98);
        }

        .message {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }
        .success {
            background: #d1fae5;
            color: #10b981;
        }
        .error {
            background: #fee2e2;
            color: #f44336;
        }
        .hidden {
            display: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
        }
        .bottom-item {
            text-align: center;
            cursor: pointer;
            padding: 6px 0;
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: #ff9800;
        }
        .bottom-item:active {
            transform: scale(0.95);
        }
        .bottom-home {
            background: #3b82f6;
            color: #ffffff !important;
            padding: 8px 0;
            border-radius: 40px;
            margin: 0 8px;
            flex: 1.2;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 350px;
        }
        .modal-content h3 {
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .modal-btn.close {
            background: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <span class="app-name">DURGA</span>
        <div class="balance" onclick="showBalance()">₹<span id="userBalance">0</span></div>
    </div>

    <div class="withdraw-card">
        <div class="withdraw-title">WITHDRAW FUNDS</div>
        
        <div class="amount-grid">
            <div class="amount-btn" onclick="selectAmount(500)">₹500</div>
            <div class="amount-btn" onclick="selectAmount(1000)">₹1000</div>
            <div class="amount-btn" onclick="selectAmount(2000)">₹2000</div>
            <div class="amount-btn" onclick="selectAmount(5000)">₹5000</div>
            <div class="amount-btn" onclick="selectAmount(10000)">₹10000</div>
            <div class="amount-btn" onclick="selectAmount(25000)">₹25000</div>
        </div>
        
        <div class="custom-amount">
            <input type="number" id="withdrawAmount" placeholder="Enter custom amount (Min ₹500)">
        </div>
        
        <div class="bank-info" id="bankInfo">
            <h4>BANK DETAILS</h4>
            <div id="bankContent">Loading...</div>
        </div>
        
        <button class="withdraw-btn" id="withdrawBtn">REQUEST WITHDRAWAL</button>
        
        <div id="message" class="message hidden"></div>
    </div>

    <div class="bottom-nav">
        <div class="bottom-item" onclick="location.href='history.html'">HISTORY</div>
        <div class="bottom-item" onclick="location.href='mybids.html'">PASSBOOK</div>
        <div class="bottom-item bottom-home" onclick="location.href='dashboard.html'">HOME</div>
        <div class="bottom-item" onclick="location.href='funds.html'">FUNDS</div>
        <div class="bottom-item" onclick="location.href='chat.html'">SUPPORT</div>
    </div>
</div>

<div id="termsModal" class="modal">
    <div class="modal-content">
        <h3>TERMS & CONDITIONS</h3>
        <p style="margin: 10px 0;">Minimum withdrawal: ₹500</p>
        <p style="margin: 10px 0;">Maximum: ₹2,50,000 per day</p>
        <p style="margin: 10px 0;">Processing: 10-60 minutes</p>
        <p style="margin: 10px 0;">Timing: 10 AM - 11 PM</p>
        <button class="modal-btn" onclick="acceptTerms()">I AGREE</button>
        <button class="modal-btn close" onclick="closeTerms()">CANCEL</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
        authDomain: "savi777-5b8af.firebaseapp.com",
        projectId: "savi777-5b8af",
        storageBucket: "savi777-5b8af.firebasestorage.app",
        messagingSenderId: "396388183217",
        appId: "1:396388183217:web:48d946a4198963cefa0690"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let selectedAmount = 500;
    let pendingAmount = 0;
    
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        await loadUserData();
        await loadBankDetails();
    });
    
    async function loadUserData() {
        const doc = await db.collection('users').doc(currentUser.uid).get();
        document.getElementById('userBalance').innerText = doc.data()?.balance || 0;
    }
    
    async function loadBankDetails() {
        const doc = await db.collection('users').doc(currentUser.uid).get();
        const bank = doc.data()?.bankDetails;
        const container = document.getElementById('bankContent');
        if (bank && bank.accountNumber) {
            container.innerHTML = `
                <div class="bank-detail">Account Holder: ${bank.accountHolder}</div>
                <div class="bank-detail">Bank Name: ${bank.bankName}</div>
                <div class="bank-detail">Account Number: ${bank.accountNumber}</div>
                <div class="bank-detail">IFSC Code: ${bank.ifscCode}</div>
            `;
        } else {
            container.innerHTML = '<div class="no-bank">No bank details found. Please add in profile.</div>';
        }
    }
    
    function selectAmount(amount) {
        selectedAmount = amount;
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('withdrawAmount').value = '';
    }
    
    function getAmount() {
        const custom = parseInt(document.getElementById('withdrawAmount').value);
        if (custom && custom >= 500) return custom;
        return selectedAmount;
    }
    
    function showMessage(msg, type) {
        const div = document.getElementById('message');
        div.innerText = msg;
        div.className = `message ${type}`;
        div.classList.remove('hidden');
        setTimeout(() => div.classList.add('hidden'), 5000);
    }
    
    document.getElementById('withdrawBtn').onclick = async () => {
        const amount = getAmount();
        if (amount < 500) { showMessage('Minimum withdrawal is ₹500', 'error'); return; }
        if (amount > 250000) { showMessage('Maximum withdrawal is ₹2,50,000', 'error'); return; }
        
        const doc = await db.collection('users').doc(currentUser.uid).get();
        const balance = doc.data()?.balance || 0;
        if (balance < amount) { showMessage(`Insufficient balance! You have ₹${balance}`, 'error'); return; }
        
        const bank = doc.data()?.bankDetails;
        if (!bank || !bank.accountNumber) { showMessage('Please add bank details first', 'error'); return; }
        
        pendingAmount = amount;
        document.getElementById('termsModal').style.display = 'flex';
    };
    
    function closeTerms() {
        document.getElementById('termsModal').style.display = 'none';
    }
    
    async function acceptTerms() {
        document.getElementById('termsModal').style.display = 'none';
        const amount = pendingAmount;
        
        const btn = document.getElementById('withdrawBtn');
        btn.disabled = true;
        btn.innerText = 'PROCESSING...';
        
        await db.collection('withdrawRequests').add({
            userId: currentUser.uid, amount: amount,
            bankDetails: (await db.collection('users').doc(currentUser.uid).get()).data().bankDetails,
            status: 'Pending', date: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        showMessage(`Withdrawal request of ₹${amount} submitted!`, 'success');
        btn.disabled = false;
        btn.innerText = 'REQUEST WITHDRAWAL';
        pendingAmount = 0;
    }
    
    function showBalance() {
        db.collection('users').doc(currentUser.uid).get().then(doc => {
            alert(`Balance: ₹${doc.data()?.balance || 0}`);
        });
    }
    
    window.selectAmount = selectAmount;
    window.showBalance = showBalance;
    window.acceptTerms = acceptTerms;
    window.closeTerms = closeTerms;
</script>
</body>
</html>
