<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        
        .users-panel { width: 320px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .users-panel h3 { padding: 18px; background: #1a1a2e; color: #fff; }
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .user-item:hover { background: #f5f5f5; }
        .user-item.active { background: #e3f2fd; border-left: 3px solid #007bff; }
        .user-name { font-weight: bold; color: #333; }
        .user-phone { font-size: 11px; color: #888; margin-top: 2px; }
        .last-msg { font-size: 11px; color: #666; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: #dc3545; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 10px; margin-left: 8px; }
        
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 18px; background: #1a1a2e; color: #fff; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; }
        .user-msg { background: #007bff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .admin-msg { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; margin-top: 5px; opacity: 0.7; }
        .no-chat { text-align: center; color: #888; padding: 50px; }
        .typing-indicator { padding: 10px 20px; font-size: 12px; color: #888; font-style: italic; }
        .input-area { padding: 15px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .input-area input:focus { border-color: #007bff; }
        .input-area button { background: #007bff; color: #fff; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="adminChatContainer" style="display: flex; width: 100%; height: 100vh;">
        <div class="users-panel">
            <h3>Active Chats</h3>
            <div class="users-list" id="usersList">Loading...</div>
        </div>
        
        <div class="chat-panel">
            <div class="chat-header" id="chatHeader">Select a user to chat</div>
            <div class="chat-messages" id="chatMessages"><div class="no-chat">Select a user from left</div></div>
            <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
            <div class="input-area" id="inputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendAdminMessage()">
                <button onclick="sendAdminMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
            authDomain: "savi777-5b8af.firebaseapp.com",
            projectId: "savi777-5b8af",
            storageBucket: "savi777-5b8af.firebasestorage.app",
            messagingSenderId: "396388183217",
            appId: "1:396388183217:web:48d946a4198963cefa0690",
            measurementId: "G-42PDZRC747"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let selectedUserId = null;
        const adminId = "admin_support";
        
        if (window.parent && window.parent.sessionStorage && window.parent.sessionStorage.getItem('adminLoggedIn') === 'true') {
            loadUsers();
        } else {
            document.body.innerHTML = '<div style="text-align:center; padding:50px;">Please login to admin panel first.</div>';
        }
        
        function loadUsers() {
            db.collection('chats').orderBy('lastMessageTime', 'desc').onSnapshot((snapshot) => {
                const container = document.getElementById('usersList');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="user-item">No active chats</div>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    const hasUnread = user.unread === true;
                    html += `<div class="user-item ${selectedUserId === doc.id ? 'active' : ''}" onclick="selectUser('${doc.id}', '${escapeHtml(user.userName)}')">
                        <div class="user-name">${escapeHtml(user.userName)}${hasUnread ? '<span class="unread-badge">New</span>' : ''}</div>
                        <div class="user-phone">${user.userPhone || ''}</div>
                        <div class="last-msg">${escapeHtml((user.lastMessage || '').substring(0, 40))}</div>
                    </div>`;
                });
                container.innerHTML = html;
            });
        }
        
        function selectUser(userId, userName) {
            selectedUserId = userId;
            document.getElementById('chatHeader').innerHTML = `Chat with: ${escapeHtml(userName)}`;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('chatMessages').innerHTML = '<div class="no-chat">Loading messages...</div>';
            db.collection('chats').doc(userId).update({ unread: false });
            loadMessages();
            db.collection('chats').doc(userId).onSnapshot((doc) => {
                if (doc.exists && doc.data().userTyping) {
                    document.getElementById('typingIndicator').innerHTML = 'User is typing...';
                    document.getElementById('typingIndicator').style.display = 'block';
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            });
        }
        
        function loadMessages() {
            if (!selectedUserId) return;
            db.collection('chats').doc(selectedUserId).collection('messages').orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
                const container = document.getElementById('chatMessages');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="no-chat">No messages yet</div>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isUser = msg.senderId !== adminId;
                    const time = msg.timestamp?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                    html += `<div class="message ${isUser ? 'user-msg' : 'admin-msg'}">
                        ${escapeHtml(msg.text)}<div class="msg-time">${time}</div>
                    </div>`;
                });
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
        }
        
        async function sendAdminMessage() {
            if (!selectedUserId) { alert('Select a user first'); return; }
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await db.collection('chats').doc(selectedUserId).collection('messages').add({
                senderId: adminId, senderName: 'Support', text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(), isAdmin: true
            });
            await db.collection('chats').doc(selectedUserId).update({
                lastMessage: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        
        window.selectUser = selectUser;
        window.sendAdminMessage = sendAdminMessage;
    </script>
</body>
</html>
