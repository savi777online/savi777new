<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SAVI777 - Support Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        
        .chat-header { background: #1a1a2e; padding: 16px 20px; display: flex; align-items: center; gap: 15px; color: #fff; }
        .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .chat-title { flex: 1; font-size: 18px; font-weight: bold; text-align: center; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14px; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .support-message { background: #e9ecef; color: #333; align-self: flex-start; }
        .message-time { font-size: 10px; margin-top: 5px; opacity: 0.7; }
        
        .typing-indicator { padding: 8px 20px; font-size: 12px; color: #888; font-style: italic; }
        .input-area { background: #fff; padding: 12px 16px; display: flex; gap: 10px; border-top: 1px solid #e0e0e0; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .input-area input:focus { border-color: #007bff; }
        .input-area button { background: #007bff; border: none; padding: 12px 24px; border-radius: 25px; color: #fff; font-weight: bold; cursor: pointer; }
        
        .welcome { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="chat-header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="chat-title">Support Chat</div>
        <div style="width:30px;"></div>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="welcome">Send a message to support. We'll respond shortly.</div>
    </div>
    
    <div class="typing-indicator" id="typingIndicator" style="display: none;">Support is typing...</div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
            authDomain: "savi777-5b8af.firebaseapp.com",
            projectId: "savi777-5b8af",
            storageBucket: "savi777-5b8af.firebasestorage.app",
            messagingSenderId: "396388183217",
            appId: "1:396388183217:web:48d946a4198963cefa0690",
            measurementId: "G-42PDZRC747"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let chatRoomId = null;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.data();
            chatRoomId = `chat_${user.uid}`;
            
            await db.collection('chats').doc(chatRoomId).set({
                userId: user.uid, userName: userData?.name || 'User', userPhone: userData?.phone || '',
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            setupChat();
        });
        
        function setupChat() {
            db.collection('chats').doc(chatRoomId).collection('messages').orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
                const container = document.getElementById('chatMessages');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="welcome">Send a message to support. We\'ll respond shortly.</div>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isUser = msg.senderId === currentUser.uid;
                    const time = msg.timestamp?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                    html += `<div class="message ${isUser ? 'user-message' : 'support-message'}">
                        ${escapeHtml(msg.text)}<div class="message-time">${time}</div>
                    </div>`;
                });
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
            
            db.collection('chats').doc(chatRoomId).onSnapshot((doc) => {
                if (doc.exists && doc.data().adminTyping) {
                    document.getElementById('typingIndicator').style.display = 'block';
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            });
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await db.collection('chats').doc(chatRoomId).collection('messages').add({
                senderId: currentUser.uid, senderName: 'User', text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(), isUser: true
            });
            await db.collection('chats').doc(chatRoomId).set({
                lastMessage: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), unread: true
            }, { merge: true });
        }
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function goBack() { window.location.href = 'dashboard.html'; }
        
        window.sendMessage = sendMessage;
        window.goBack = goBack;
    </script>
</body>
</html>
