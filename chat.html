<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DURGA - Support Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }
        .chat-title {
            flex: 1;
            font-size: 18px;
            font-weight: 700;
            color: #00aa55;
            text-align: center;
            animation: blockPulse 2s infinite;
        }
        @keyframes blockPulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
            50% { opacity: 1; text-shadow: 0 0 5px rgba(0,170,85,0.3); }
            100% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
        }

        /* Chat Messages - Scrollable Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f0f2f5;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .user-message {
            background: #ff9800;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .support-message {
            background: #ffffff;
            color: #1a1a2e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .message-time {
            font-size: 10px;
            margin-top: 6px;
            opacity: 0.7;
        }

        /* Typing Indicator */
        .typing-indicator {
            padding: 8px 16px;
            font-size: 12px;
            color: #ff9800;
            font-style: italic;
            background: #f0f2f5;
        }

        /* Input Container - Fixed at Bottom */
        .input-container {
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            padding: 12px 16px;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            background: #f5f5f5;
        }
        .input-wrapper input:focus {
            border-color: #ff9800;
        }
        .input-wrapper button {
            background: #ff9800;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .input-wrapper button:active {
            transform: scale(0.97);
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 40px;
            color: #888;
            background: #ffffff;
            border-radius: 20px;
            margin: 20px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 16px;
            border-top: 1px solid #e0e0e0;
        }
        .bottom-item {
            text-align: center;
            cursor: pointer;
            padding: 6px 0;
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: #ff9800;
        }
        .bottom-item:active {
            transform: scale(0.95);
        }
        .bottom-home {
            background: #3b82f6;
            color: #ffffff !important;
            padding: 8px 0;
            border-radius: 40px;
            margin: 0 8px;
            flex: 1.2;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="chat-header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="chat-title">DURGA SUPPORT</div>
        <div style="width: 30px;"></div>
    </div>
    
    <!-- Messages Area -->
    <div class="chat-messages" id="chatMessages">
        <div class="welcome">💬 Send a message to support. We'll respond shortly.</div>
    </div>
    
    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">Support is typing...</div>
    
    <!-- Input Area - ALWAYS VISIBLE -->
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="bottom-item" onclick="location.href='history.html'">HISTORY</div>
        <div class="bottom-item" onclick="location.href='mybids.html'">PASSBOOK</div>
        <div class="bottom-item bottom-home" onclick="location.href='dashboard.html'">HOME</div>
        <div class="bottom-item" onclick="location.href='funds.html'">FUNDS</div>
        <div class="bottom-item" onclick="location.href='chat.html'">SUPPORT</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
            authDomain: "savi777-5b8af.firebaseapp.com",
            projectId: "savi777-5b8af",
            storageBucket: "savi777-5b8af.firebasestorage.app",
            messagingSenderId: "396388183217",
            appId: "1:396388183217:web:48d946a4198963cefa0690"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let chatRoomId = null;
        let currentUserData = null;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) { 
                window.location.href = 'index.html'; 
                return; 
            }
            currentUser = user;
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            currentUserData = userDoc.data();
            chatRoomId = `chat_${user.uid}`;
            
            await db.collection('chats').doc(chatRoomId).set({
                userId: user.uid,
                userName: currentUserData?.name || 'User',
                userPhone: currentUserData?.phone || '',
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            setupChat();
        });
        
        function setupChat() {
            db.collection('chats').doc(chatRoomId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('chatMessages');
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="welcome">💬 Send a message to support. We\'ll respond shortly.</div>';
                        return;
                    }
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isUser = msg.senderId === currentUser.uid;
                        const time = msg.timestamp?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                        
                        html += `
                            <div class="message ${isUser ? 'user-message' : 'support-message'}">
                                ${escapeHtml(msg.text)}
                                <div class="message-time">${time}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                });
            
            db.collection('chats').doc(chatRoomId).onSnapshot((doc) => {
                if (doc.exists && doc.data().adminTyping) {
                    document.getElementById('typingIndicator').style.display = 'block';
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            });
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            try {
                await db.collection('chats').doc(chatRoomId).collection('messages').add({
                    senderId: currentUser.uid,
                    senderName: currentUserData?.name || 'User',
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isUser: true
                });
                
                await db.collection('chats').doc(chatRoomId).set({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    unread: true
                }, { merge: true });
                
            } catch (error) {
                alert("Error sending message: " + error.message);
            }
        }
        
        function escapeHtml(str) { 
            if (!str) return ''; 
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
        }
        
        function goBack() { 
            window.location.href = 'dashboard.html'; 
        }
        
        let typingTimeout;
        const inputField = document.getElementById('messageInput');
        if (inputField) {
            inputField.addEventListener('input', () => {
                if (!chatRoomId) return;
                db.collection('chats').doc(chatRoomId).update({ userTyping: true }).catch(() => {});
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    db.collection('chats').doc(chatRoomId).update({ userTyping: false }).catch(() => {});
                }, 1000);
            });
        }
        
        window.sendMessage = sendMessage;
        window.goBack = goBack;
    </script>
</body>
</html>
