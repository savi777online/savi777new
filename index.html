<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DURGA - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .app-title {
            font-size: 32px;
            font-weight: 800;
            color: #00aa55;
            margin-bottom: 8px;
            animation: blockPulse 2s infinite;
        }
        @keyframes blockPulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(0,170,85,0.5); }
            100% { opacity: 0.7; text-shadow: 0 0 0px rgba(0,170,85,0); }
        }

        .app-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            font-size: 16px;
            color: #1a1a2e;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #ff9800;
            box-shadow: 0 0 0 3px rgba(255,152,0,0.1);
        }

        .input-field::placeholder {
            color: #aaa;
        }

        .pin-input {
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #ff9800;
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #f57c00;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #10b981;
        }
        .btn-secondary:hover {
            background: #059669;
        }

        .link {
            text-align: center;
            margin-top: 16px;
            color: #ff9800;
            font-size: 13px;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 500;
        }

        .link:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 20px 0;
            height: 1px;
            background: #e0e0e0;
        }

        .error-text {
            color: #f44336;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
        }

        .success-text {
            color: #10b981;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-card">
            <div class="app-title">DURGA</div>
            <div class="app-subtitle">Login to your account</div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="loginPhone" class="input-field" placeholder="Enter 10-digit mobile number" maxlength="10" inputmode="numeric" pattern="\d*">
            </div>
            <div class="input-group">
                <label>MPIN (4 digits)</label>
                <input type="password" id="loginPin" class="input-field pin-input" placeholder="●●●●" maxlength="4" inputmode="numeric" pattern="\d*">
            </div>
            <button class="btn" id="loginBtn">LOGIN</button>
            <button class="link" id="showRegisterBtn">Don't have an account? REGISTER</button>
            <button class="link" id="showForgotBtn">FORGOT MPIN?</button>
            <div id="loginError" class="error-text"></div>
            <div class="footer">Secure & Trusted Platform</div>
        </div>

        <!-- Register Screen -->
        <div id="registerScreen" class="login-card hidden">
            <div class="app-title">DURGA</div>
            <div class="app-subtitle">Create new account</div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" class="input-field" placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="regPhone" class="input-field" placeholder="Enter 10-digit mobile number" maxlength="10" inputmode="numeric" pattern="\d*">
            </div>
            <div class="input-group">
                <label>Create MPIN (4 digits)</label>
                <input type="password" id="regPin" class="input-field pin-input" placeholder="●●●●" maxlength="4" inputmode="numeric" pattern="\d*">
            </div>
            <div class="input-group">
                <label>Confirm MPIN</label>
                <input type="password" id="regConfirmPin" class="input-field pin-input" placeholder="●●●●" maxlength="4" inputmode="numeric" pattern="\d*">
            </div>
            <button class="btn" id="registerBtn">REGISTER</button>
            <button class="link" id="backToLoginBtn">BACK TO LOGIN</button>
            <div id="regError" class="error-text"></div>
        </div>

        <!-- Forgot MPIN Screen -->
        <div id="forgotScreen" class="login-card hidden">
            <div class="app-title">DURGA</div>
            <div class="app-subtitle">Reset your MPIN</div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="forgotPhone" class="input-field" placeholder="Enter registered mobile number" maxlength="10" inputmode="numeric" pattern="\d*">
            </div>
            <div class="input-group">
                <label>New MPIN (4 digits)</label>
                <input type="password" id="newPin" class="input-field pin-input" placeholder="●●●●" maxlength="4" inputmode="numeric" pattern="\d*">
            </div>
            <div class="input-group">
                <label>Confirm New MPIN</label>
                <input type="password" id="confirmNewPin" class="input-field pin-input" placeholder="●●●●" maxlength="4" inputmode="numeric" pattern="\d*">
            </div>
            <button class="btn" id="resetPinBtn">RESET MPIN</button>
            <button class="link" id="backToLoginFromForgot">BACK TO LOGIN</button>
            <div id="forgotError" class="error-text"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBf35TW3xiBhwCYFHFNwrB9olxJ3sj2cPw",
            authDomain: "savi777-5b8af.firebaseapp.com",
            projectId: "savi777-5b8af",
            storageBucket: "savi777-5b8af.firebasestorage.app",
            messagingSenderId: "396388183217",
            appId: "1:396388183217:web:48d946a4198963cefa0690"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        
        function showScreen(screenId) {
            const screens = ['loginScreen', 'registerScreen', 'forgotScreen'];
            screens.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }
        
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = message;
                setTimeout(() => el.innerText = '', 4000);
            }
        }
        
        // Login with MPIN
        document.getElementById('loginBtn').onclick = async function() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value;
            
            if (!phone || phone.length !== 10) {
                showError('loginError', 'Enter valid 10-digit mobile number');
                return;
            }
            if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                showError('loginError', 'MPIN must be 4 digits');
                return;
            }
            
            const fullPhone = '+91' + phone;
            const btn = this;
            btn.disabled = true;
            btn.innerText = 'LOGGING IN...';
            
            try {
                // Find user by phone number
                const usersRef = db.collection('users');
                const querySnapshot = await usersRef.where('phone', '==', fullPhone).get();
                
                if (querySnapshot.empty) {
                    showError('loginError', 'No account found with this number');
                    btn.disabled = false;
                    btn.innerText = 'LOGIN';
                    return;
                }
                
                let userDoc = null;
                let userId = null;
                querySnapshot.forEach(doc => {
                    userDoc = doc.data();
                    userId = doc.id;
                });
                
                if (userDoc.pin !== pin) {
                    showError('loginError', 'Invalid MPIN');
                    btn.disabled = false;
                    btn.innerText = 'LOGIN';
                    return;
                }
                
                // Create anonymous auth session (or email/password)
                // For simplicity, we'll use session storage to track login
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('userId', userId);
                sessionStorage.setItem('userPhone', fullPhone);
                sessionStorage.setItem('userName', userDoc.name);
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                showError('loginError', error.message);
                btn.disabled = false;
                btn.innerText = 'LOGIN';
            }
        };
        
        // Register new user
        document.getElementById('registerBtn').onclick = async function() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            
            if (!name) {
                showError('regError', 'Enter your name');
                return;
            }
            if (!phone || phone.length !== 10) {
                showError('regError', 'Enter valid 10-digit mobile number');
                return;
            }
            if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                showError('regError', 'MPIN must be 4 digits');
                return;
            }
            if (pin !== confirmPin) {
                showError('regError', 'MPINs do not match');
                return;
            }
            
            const fullPhone = '+91' + phone;
            const btn = this;
            btn.disabled = true;
            btn.innerText = 'REGISTERING...';
            
            try {
                // Check if user already exists
                const existingUser = await db.collection('users').where('phone', '==', fullPhone).get();
                if (!existingUser.empty) {
                    showError('regError', 'Account already exists with this number');
                    btn.disabled = false;
                    btn.innerText = 'REGISTER';
                    return;
                }
                
                // Create user document
                const userRef = db.collection('users').doc();
                await userRef.set({
                    uid: userRef.id,
                    name: name,
                    phone: fullPhone,
                    pin: pin,
                    balance: 0,
                    role: 'user',
                    createdAt: new Date()
                });
                
                showError('regError', 'Account created successfully! Please login.');
                document.getElementById('regError').style.color = '#10b981';
                setTimeout(() => {
                    showScreen('loginScreen');
                    document.getElementById('loginPhone').value = phone;
                }, 2000);
                
            } catch (error) {
                showError('regError', error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'REGISTER';
            }
        };
        
        // Reset MPIN
        document.getElementById('resetPinBtn').onclick = async function() {
            const phone = document.getElementById('forgotPhone').value.trim();
            const newPin = document.getElementById('newPin').value;
            const confirmPin = document.getElementById('confirmNewPin').value;
            
            if (!phone || phone.length !== 10) {
                showError('forgotError', 'Enter valid 10-digit mobile number');
                return;
            }
            if (!newPin || newPin.length !== 4 || !/^\d{4}$/.test(newPin)) {
                showError('forgotError', 'New MPIN must be 4 digits');
                return;
            }
            if (newPin !== confirmPin) {
                showError('forgotError', 'MPINs do not match');
                return;
            }
            
            const fullPhone = '+91' + phone;
            const btn = this;
            btn.disabled = true;
            btn.innerText = 'RESETTING...';
            
            try {
                const usersRef = db.collection('users');
                const querySnapshot = await usersRef.where('phone', '==', fullPhone).get();
                
                if (querySnapshot.empty) {
                    showError('forgotError', 'No account found with this number');
                    btn.disabled = false;
                    btn.innerText = 'RESET MPIN';
                    return;
                }
                
                let userId = null;
                querySnapshot.forEach(doc => {
                    userId = doc.id;
                });
                
                await db.collection('users').doc(userId).update({ pin: newPin });
                
                showError('forgotError', 'MPIN reset successfully! Please login.');
                document.getElementById('forgotError').style.color = '#10b981';
                setTimeout(() => {
                    showScreen('loginScreen');
                    document.getElementById('loginPhone').value = phone;
                }, 2000);
                
            } catch (error) {
                showError('forgotError', error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'RESET MPIN';
            }
        };
        
        // Navigation buttons
        document.getElementById('showRegisterBtn').onclick = () => showScreen('registerScreen');
        document.getElementById('showForgotBtn').onclick = () => showScreen('forgotScreen');
        document.getElementById('backToLoginBtn').onclick = () => showScreen('loginScreen');
        document.getElementById('backToLoginFromForgot').onclick = () => showScreen('loginScreen');
        
        // Check if already logged in
        if (sessionStorage.getItem('loggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
